<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="planes.css">
</head>

<body>

  <div class="container my-5">
  <main>

    <div class="w-100">

      <h2 class="text-center fw-bold mb-4" style="color: var(--color-quinto)">
        Nuestros Planes
      </h2>
      <div id="contenedorPlanes" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 p-4 g-4 justify-content-center">
      </div>
    </div>

  </main>
  </div>

  <div class="modal fade" id="modalSalvajeSignature" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header border-0">
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
          <div class="modal-body">
            <div class="row">
              <img 
                id="modalImagen"
                class="img-fluid rounded mb-3 col-12 col-lg-6 w-lg-50"
                src=""
                alt="plan"
              />
              <div class="col-12 col-lg-6 d-flex flex-column">
                <h4 id="modalTitulo" class="fw-bold"></h4>
                <p id="modalDescripcion" class="mt-2"></p>
                <div class="flex-grow-1"></div>
                <button class="btn btn-agregar btn-reservar" id="btn-reservar" data-id="11">
                  📅 Reservar
                </button>
              </div>
            </div>
            <hr />
            <div class="d-flex justify-content-around align-items-center">
              <div>
                <p class="mb-0 text-muted">Precio:</p>
                <h4 id="modalPrecio" class="fw-bold precio"></h4>
              </div>
            </div>
          </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="planes.js"></script>
  <script src="app.js"></script>
  <script src="panel-de-control.js"></script>
</body>

</html>
