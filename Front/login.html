<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="login.css">
</head>

<body class="bg-light">

    <main class="min-vh-100 d-flex align-items-center row  w-100">
        <section class="col-md-5 d-none d-md-flex p-0 img-container">
            <img src="./imagenes/login.jpg" alt="imagen-login" class="img-login" />
        </section>
        <section id="form" class="card shadow-sm p-4 col-md-7 mx-auto" style="max-width: 380px; width: 100%;">
            <header class="text-center mb-4">
                <h2>Iniciar Sesión</h2>
                <p class="text-muted">Ingresa tus credenciales para continuar</p>
            </header>

            <form id="loginForm" novalidate>

                <div class="mb-3">
                    <label for="loginCorreo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="loginCorreo" required>
                    <div id="errorLoginCorreo" class="text-danger small mt-1"></div>
                </div>

                <div class="mb-3">
                    <label for="loginPassword" class="form-label">Contraseña</label>

                    <div class="position-relative">
                        <input type="text" class="form-control pe-5" id="loginPassword" required>

                        <i class="bi bi-eye-slash position-absolute top-50 end-0 translate-middle-y me-3 cursor-pointer"
                            id="togglePassword"></i>
                    </div>

                    <div id="errorLoginPassword" class="text-danger small mt-1"></div>
                </div>



                <div id="alertaError" class="alert alert-danger d-none text-center py-2" role="alert">Usuario o
                    contraseña incorrectos</div>

                <div id="alertaExito" class="alert alert-success d-none text-center py-2" role="alert">Inicio exitoso
                </div>

                <button type="submit" class="btn-ingreso btn-primary text-white w-100">Ingresar</button>

                <div class="text-center mt-3">
                    <small>¿No tienes cuenta? <a href="registro.html">Regístrate</a></small>
                </div>

            </form>
        </section>
    </main>

    <script src="login.js"></script>
</body>

</html>
