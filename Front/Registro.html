<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"rel="stylesheet"/>
    <link rel="stylesheet" href="Registro.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  </head>
  <body>
    <main class="min-vh-100 d-flex align-items-center justify-content-center">
      <section class="col-12 col-lg-6" id="form">
        <div class="formulario" id="formulario-container">
          <h3 class="contacto-titulo pb-4 pt-4 text-center">
            REGÍSTRATE AQUÍ PARA TU PRÓXIMO DESAFÍO
          </h3>

          <form
             id="registro" novalidate>
            <div class="form-floating mb-1">
              <input
                type="text"
                class="form-control"
                id="nombre"
                name="nombre"
                placeholder="Nombre"
                required
              />
              <label for="nombre">Nombre completo</label>
            </div>
            <span id="errorNombre" class="text-danger d-block mt-1 mb-2"></span>

            <div class="form-floating mb-1">
              <input
                type="email"
                class="form-control"
                id="correo"
                name="correo"
                placeholder="Correo"
                required
              />
              <label for="correo">Correo electrónico</label>
            </div>
            <span id="errorCorreo" class="text-danger d-block mt-1 mb-2"></span>


            <div class="form-floating mb-1">
              <input type="tel" class="form-control" id="telefono"
              name="telefono" placeholder="Teléfono" required>
              <label for="telefono">Teléfono</label>
            </div>
            <span id="errorTelefono" class="text-danger d-block mt-1 mb-2"></span>


            <div class="input-group mb-1">
                <div class="form-floating mb-1">
                    <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Contraseña"
                    required
                    />
                    <label for="password">Contraseña</label>
                </div>
                <button class="btn btn-outline-secondary mb-1" type="button" id="togglePassword">
                  <i class="bi bi-eye" id="iconPassword"></i>
                </button>
                
            </div>

            <div class="input-group">
                <div class="form-floating mb-1">
                    <input
                    type="password"
                    class="form-control"
                    id="password2"
                    placeholder="Confirmar contraseña"
                    required
                    />
                    <label for="password2">Confirmar contraseña</label>
                </div>
                <button class="btn btn-outline-secondary mb-1" type="button" id="togglePassword2">
                  <i class="bi bi-eye" id="iconPassword2"></i>
                </button>
            </div>
            </div>

            <span id="errorPassword" class="text-danger"></span>

            <div>
              <h5 class="form-floating mt-2 mb-2" >CONTACTO DE EMERGENCIA</h5>
              <div class="form-floating mb-1">
                <input
                  type="text"
                  class="form-control"
                  id="contactoEmergencia"
                  name="contactoEmergencia"
                  placeholder="Contacto de emergencia"
                  required
                />
                <label for="contactoEmergencia"
                  >Nombre del contacto de emergencia</label
                >
              </div>
                <span id="errorContactoEmergencia" class="text-danger d-block mt-1 mb-2"></span>
              <div class="form-floating mb-1">
                <input
                  type="text"
                  class="form-control"
                  id="parentescoEmergencia"
                  name="parentescoEmergencia"
                  placeholder="Parentesco de emergencia"
                  required
                />
                <label for="parentescoEmergencia"
                  >Parentesco del contacto de emergencia</label
                >
              </div>
                <span id="errorParentescoEmergencia" class="text-danger d-block mt-1 mb-2"></span>
              <div class="form-floating mb-1">
                <input
                  type="tel"
                  class="form-control"
                  id="telefonoEmergencia"
                  name="telefonoEmergencia"
                  placeholder="Teléfono de emergencia"
                  required
                />
                <label for="telefonoEmergencia"
                  >Teléfono del contacto de emergencia</label
                >
              </div>
                <span id="errorTelefonoEmergencia" class="text-danger d-block mt-1 mb-2"></span>
            </div>

            <div
              id="alertaExito"
              class="alert alert-success d-none text-center mb-2"
            >
              ¡Registro exitoso!
            </div>

            <button type="submit" class="btn btn-registro w-100 mt-2 text-white">
              Registrarse
            </button>
          </form>
        </div>
      </section>
    </main>
    <script src="Registro.js"></script>
   <script src="app.js"></script>
  </body>
</html>
