        <section class="container px-3 mt-4">

            <h3 class="mb-3">Reservas</h3>

            <button id="btnFormAct" class="btn mb-3" type="button">➕ Añadir Nueva Reserva</button>

            <div id="formContainer" style="display:none;">

                <form id="formActividad" class="card card-body">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <input type="text" id="nombre" class="form-control" placeholder="Nombre del Cliente"
                                required>
                        </div>


                        <div class="col-md-6">
                            <select id="categoria" class="form-select" required>
                                <option value="">Tipo de plan</option>
                                <option value="Ruta Salvaje Signature">Plan Ruta Salvaje Signature</option>
                                <option value="Desafío Total">Plan Desafío Total</option>
                                <option value="Explorador de las nubes">Plan Explorador de las nubes</option>
                                <option value="Ruta del vértigo">Plan Ruta del vértigo</option>
                                <option value="Agua y roca">Plan Agua y roca</option>
                                <option value="Travesía del horizonte">Plan Travesía del horizonte</option>
                                <option value="Caminos colglgantes</option>
                                <option value="Supervivencia extrema">Plan Supervivencia extrema</option>antes">Plan Caminos co
                                <option value="Aventura en el bosque">Plan Aventura en el bosque</option>
                                <option value="El salto del caminante">Plan El salto del caminante</option>
                                <option value="Adrenalina">Plan Adrenalina</option>
                                <option value="Familiar">Plan Familiar</option>
                                <option value="Extremo">Plan Extremo</option>
                                <option value="Romántico">Plan Romántico</option>
                                <option value="Corporativo">Plan Corporativo</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <input type="number" id="personas" class="form-control" placeholder="Cantidad de Personas"
                                required>
                        </div>

                        <div class="col-md-4">
                            <select id="dificultad" class="form-select" required>
                                <option value="">Dificultad</option>
                                <option value="Baja">Baja</option>
                                <option value="Media">Media</option>
                                <option value="Alta">Alta</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <input type="number" id="precio" class="form-control" placeholder="Precio del plan"
                                required>
                        </div>

                        <div class="col-md-4">
                            <input type="date" id="fecha" class="form-control" required>
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-guardar">Guardar Reserva</button>
                        </div>

                    </div>
                </form>
            </div>

            <div class="mt-4">
                <h5>Lista de Reservas </h5>
                <div id="listaReservas" class="row g-3"></div>
            </div>

        </section>
