                            <svg xmlns="http://www.w3.org/2000/svg" width="23" height="23" fill="#ff8c00"

                </section>

                <section class="col-12 col-lg-6">
                    <div class="formulario">

                        <h3 class="contacto-titulo pb-4 text-center">TU AVENTURA EMPIEZA AQUÍ</h3>

                        <form id="contacto" action="https://formspree.io/f/mqewpyvv" method="POST" novalidate>

                            <div class="form-floating mb-1">
                                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre">
                                <label for="nombre">Nombre completo</label>
                            </div>
                            <span id="errorNombre" class="error-mensaje"></span>  

                            <div class="form-floating mb-1">
                                <input type="email" class="form-control" id="correo" name="correo" placeholder="Correo">
                                <label for="correo">Correo electrónico</label>
                            </div>
                            <span id="errorCorreo" class="error-mensaje"></span>

                            <div class="form-floating mb-1">
                                <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Teléfono">
                                <label for="telefono">Teléfono</label>
                            </div>
                            <span id="errorTelefono" class="error-mensaje"></span>

                            <div class="form-floating mb-1">
                                <textarea class="form-control" id="mensaje" name="mensaje" placeholder="Mensaje" style="height: 120px"></textarea>
                                <label for="mensaje">Mensaje</label>
                            </div>
                            <span id="errorMensaje" class="error-mensaje"></span>

                            <div id="alertaExito" class="alert alert-success d-none text-center mb-3" style="background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 10px; border-radius: 5px;">¡Formulario enviado correctamente!.</div>

                            <button type="submit" id="btn-formulario" class="btn btn-contacto w-50 mt-3 my-0 mx-auto d-block">Enviar mensaje</button>

                        </form>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <script src="contacto.js"></script>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
