<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="Reservas-Usuario.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"rel="stylesheet"
    />
  </head>

  <body>
    <main class="container my-5">
        <div class="row g-4"> 
            
            <div class="col-md-8">
                <h2 class="fw-bold mb-4">Carrito de Aventuras</h2>
                
                <div class="d-flex justify-content-between border-bottom pb-2 fw-bold small text-secondary">
                    <span>Reserva</span>
                    <span>Precio</span>
                    <span>Personas</span>
                    <span>Subtotal</span>
                </div>

                <div id="lista-reservas" class="mt-3">
                    <p class="text-muted italic"></p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="p-4 border rounded shadow-sm">
                    
                    <div class="mb-4">
                        <label class="form-label small fw-bold">FECHA</label>
                        <input type="date" class="form-control mb-3" required />
                        
                        <label class="form-label small fw-bold">PERSONAS</label>
                        <input type="number" class="form-control" id="numPersonas" value="1" min="1" />
                    </div>

                    <hr>

                    <h2 class="fw-bold h4 mt-4" style="color: orange;">Resumen de Reserva</h2>
                    
                    <div class="my-3">
                        <p class="mb-1">Subtotal: $ <span id="subtotal">0</span></p>
                        <h3 class="fw-bold">Total: $ <span id="montoTotal">0</span></h3>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button class="btn btn-outline-dark">CONFIRMAR RESERVA</button>
                        <button class="btn btn-outline-dark">Vaciar Carrito</button>
                    </div>
                </div>
            </div>
        </div> 
    </main>

    <script src="Reservas-Usuario.js"></script>
    <script src="app.js"></script>
  </body>
</html>
