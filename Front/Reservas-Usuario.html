<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="Reservas-Usuario.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet"/>
</head>

<body>

  <div id="navbar"></div>

  <div class="page-wrapper">
    <main class="py-5">
      <div class="container">

        <h2 class="carrito-titulo">Carrito de Aventuras</h2>
        <p class="carrito-subtitulo">Revisa tu plan y confirma tu reserva</p>

        <div id="alerta" class="alerta-inline"></div>

        <div class="row g-4 align-items-start">

          <div class="col-lg-9">
            <div class="carrito-lista-col">
              <div class="tabla-header">
                <span class="th-reserva">Reserva</span>
                <span class="th-dato">Precio</span>
                <span class="th-dato">Personas</span>
                <span class="th-dato">Total</span>
              </div>
              <div id="lista-reservas"></div>
            </div>
          </div>

          <div class="col-lg-3">
            <div class="resumen-card sticky-top" style="top: 24px;">

              <div class="campo-grupo">
                <label class="campo-label">Fecha</label>
                <input type="date" class="campo-input" id="fechaReserva"/>
              </div>

              <div class="campo-grupo">
                <label class="campo-label">Personas</label>
                <div class="personas-control">
                  <button class="personas-btn" id="btnMenos">−</button>
                  <input type="number" class="campo-input personas-input" id="numPersonas" value="1" min="1"/>
                  <button class="personas-btn" id="btnMas">+</button>
                </div>
              </div>

              <div class="resumen-total">
                <span>Total</span>
                <span class="total-monto">$ <span id="montoTotal">0</span></span>
              </div>

              <div class="resumen-acciones">
                <button id="btnConfirmar" class="btn-confirmar">Confirmar reserva</button>
                <button id="btnVaciar" class="btn-vaciar">Vaciar carrito</button>
              </div>

            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <div id="footer"></div>

  <script src="Reservas-Usuario.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
  <script src="app.js"></script>

</body>
</html>
